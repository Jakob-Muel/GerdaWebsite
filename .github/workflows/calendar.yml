name: Kalender aktualisieren

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Nie zwei Läufe gleichzeitig, sonst kollidieren die Pushes
concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run calendar
      - name: Änderungen committen
        run: |
          git config user.name "gerda-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || (git commit -m "Kalender aktualisiert" && git pull --rebase && git push)
